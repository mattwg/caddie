[project]
name = "caddie"
version = "0.1.0"
description = "Caddie: a plugin-based harness for connector- and skill-driven analytics notebooks"
readme = "README.md"
authors = [
    { name = "Matt Gardner", email = "matt.w.gardner@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "marimo[sandbox]>=0.21.1",
    "plotly>=5.24",
    "ruamel-yaml>=0.18",
    "databricks-connect>=15.4",
]

[project.scripts]
caddie = "caddie:main"

[project.entry-points."caddie.connectors"]
fake = "caddie.connectors.fake:FakeConnector"
databricks = "caddie.connectors.databricks:DatabricksConnector"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"
